# Публикация веб-версии на GitHub Pages.
#
# Выкладывается папка web-static как есть: там только статика, никакого
# сервера. Сначала прогоняется сверка JS с эталоном Python — выложить
# версию, которая считает не то же самое, что скачиваемая программа, хуже,
# чем не выложить вовсе.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Сверка JS с Python перед публикацией
        run: node web-static/tests/node.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
